services:
  - type: web
    name: ctrlaltwin-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
      - key: TTS_PROVIDER
        value: edge-tts
      - key: EDGE_TTS_VOICE
        value: en-US-ChristopherNeural
      - key: IMAGE_PROVIDER
        value: mock
      - key: RENDER_MODE
        value: local
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: REMOTION_AWS_REGION
        value: us-east-1
      - key: REMOTION_FUNCTION_NAME
        sync: false
      - key: REMOTION_SERVE_URL
        sync: false
      - key: REMOTION_FRAMES_PER_LAMBDA
        value: "30"
